
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" preserveAspectRatio="xMidYMid slice" role="img" aria-labelledby="bannerTitle bannerDesc">
  <title id="bannerTitle">Tanya von Rox — Ingeniería en Sistemas</title>
  <desc id="bannerDesc">Banner de perfil: Informática Forense, Ciberseguridad y Desarrollo. Miembro estudiantil IEEE.</desc>

  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#010409" />
      <stop offset="100%" stop-color="#0d1117" />
    </linearGradient>
    <pattern id="dots" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="0.5" fill="#30363d" />
    </pattern>
  </defs>

  <!-- Fondo -->
  <rect width="1000" height="300" fill="url(#bg-grad)" />
  <rect width="1000" height="300" fill="url(#dots)" />
  <rect x="0" y="0" width="1000" height="2" fill="#58a6ff" opacity="0.15" />

  <!-- Etiqueta IEEE -->
  <g transform="translate(825,40)">
    <rect x="0" y="0" width="135" height="25" rx="4" fill="#ffffff" opacity="0.1" />
    <text x="67.5" y="17" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="12" font-weight="bold" fill="#58a6ff">ESTUDIANTE IEEE</text>
  </g>

  <!-- Bloque principal -->
  <g transform="translate(60,130)">
    <text x="0" y="-40" font-family="ui-monospace, 'Cascadia Code', 'Fira Code', Consolas, monospace" font-size="16" font-weight="500" fill="#58a6ff" opacity="0.7">&gt; root@tanya_von_rox:~/ing_sistemas$</text>
    <text x="0" y="5" font-family="'Segoe UI', system-ui, sans-serif" font-size="32" font-weight="bold" fill="#ffffff">Tanya von Rox</text>
    <text x="0" y="35" font-family="ui-monospace, 'Cascadia Code', 'Fira Code', Consolas, monospace" font-size="16" font-weight="500" fill="#58a6ff">Ingeniería en Sistemas</text>
    <g transform="translate(0,65)">
      <text x="0" y="0" font-family="'Segoe UI', system-ui, sans-serif" font-size="14" fill="#8b949e" letter-spacing="1">INFORMÁTICA FORENSE • CIBERSEGURIDAD • DESARROLLO</text>
      <rect x="0" y="12" width="470" height="1" fill="#30363d" />
    </g>
  </g>

  <!-- Motivo orbital + ecuaciones -->
  <g transform="translate(700,150)" opacity="0.2" stroke="#58a6ff" fill="none">
    <ellipse cx="0" cy="0" rx="60" ry="20" transform="rotate(45)" />
    <ellipse cx="0" cy="0" rx="60" ry="20" transform="rotate(-45)" />
    <circle cx="0" cy="0" r="5" fill="#58a6ff" stroke="none" />
  </g>
  <g transform="translate(700,150)">
    <text x="80" y="-40" font-family="'Cambria Math', Georgia, serif" font-style="italic" font-size="14" fill="#3fb950">δU = δQ − δW</text>
    <text x="80" y="60" font-family="'Cambria Math', Georgia, serif" font-style="italic" font-size="14" fill="#3fb950">f(x) = ∫ φ(t) dt</text>
  </g>

  <!-- Barras decorativas -->
  <g transform="translate(920,100)" opacity="0.3">
    <rect x="0" y="0" width="30" height="4" fill="#238636" />
    <rect x="0" y="10" width="50" height="4" fill="#58a6ff" />
    <rect x="0" y="20" width="20" height="4" fill="#d29922" />
  </g>
</svg>
