<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" preserveAspectRatio="xMidYMid slice" role="img" aria-labelledby="bannerTitle bannerDesc">
  <title id="bannerTitle">Tanya von Rox — Ingeniería en Sistemas</title>
  <desc id="bannerDesc">Banner de perfil: Informática Forense, Ciberseguridad y Desarrollo. Miembro estudiantil IEEE.</desc>

  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#010409" stop-opacity="1" />
      <stop offset="100%" stop-color="#0d1117" stop-opacity="1" />
    </linearGradient>

    <pattern id="dots" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="0.5" fill="#30363d" />
    </pattern>

    <style>
      /* Sin dependencias externas: pilas de fuentes del sistema (GitHub bloquea @import via camo/CSP) */
      .text-name   { font: bold 32px 'Segoe UI', system-ui, -apple-system, sans-serif; fill: #ffffff; }
      .text-sub    { font: 500 16px ui-monospace, 'Cascadia Code', 'Fira Code', Consolas, monospace; fill: #58a6ff; }
      .text-detail { font: 400 14px 'Segoe UI', system-ui, sans-serif; fill: #8b949e; letter-spacing: 1px; }
      .ieee-tag    { font: bold 12px 'Segoe UI', system-ui, sans-serif; fill: #58a6ff; }
      .eq          { font: italic 14px 'Cambria Math', Georgia, serif; fill: #3fb950; }

      /* SMIL (via <animate>) es más portable que @keyframes cuando el SVG se incrusta como imagen */
    </style>
  </defs>

  <!-- Fondo -->
  <rect width="1000" height="300" fill="url(#bg-grad)" />
  <rect width="1000" height="300" fill="url(#dots)" />

  <!-- Línea de escaneo (SMIL: se anima incluso incrustado como <img>) -->
  <rect x="0" y="0" width="1000" height="2" fill="#58a6ff" opacity="0.06">
    <animate attributeName="y" from="0" to="300" dur="8s" repeatCount="indefinite" />
  </rect>

  <!-- Etiqueta IEEE -->
  <g transform="translate(825,40)">
    <rect x="0" y="0" width="135" height="25" rx="4" fill="#ffffff" opacity="0.1" />
    <text x="67.5" y="17" text-anchor="middle" class="ieee-tag">ESTUDIANTE IEEE</text>
  </g>

  <!-- Bloque principal -->
  <g transform="translate(60,130)">
    <text x="0" y="-40" class="text-sub" opacity="0.7">&gt; root@tanya_von_rox:~/ing_sistemas$</text>
    <text x="0" y="5"  class="text-name">Tanya von Rox</text>
    <text x="0" y="35" class="text-sub">Ingeniería en Sistemas</text>
    <g transform="translate(0,65)">
      <text x="0" y="0" class="text-detail">INFORMÁTICA FORENSE • CIBERSEGURIDAD • DESARROLLO</text>
      <rect x="0" y="12" width="470" height="1" fill="#30363d" />
    </g>
  </g>

  <!-- Motivo orbital + ecuaciones -->
  <g transform="translate(700,150)" opacity="0.2" stroke="#58a6ff" fill="none">
    <ellipse cx="0" cy="0" rx="60" ry="20" transform="rotate(45)" />
    <ellipse cx="0" cy="0" rx="60" ry="20" transform="rotate(-45)" />
    <circle cx="0" cy="0" r="5" fill="#58a6ff" stroke="none" />
  </g>
  <g transform="translate(700,150)">
    <text x="80" y="-40" class="eq">δU = δQ − δW</text>
    <text x="80" y="60"  class="eq">f(x) = ∫ φ(t) dt</text>
  </g>

  <!-- Barras decorativas -->
  <g transform="translate(920,100)" opacity="0.3">
    <rect x="0" y="0"  width="30" height="4" fill="#238636" />
    <rect x="0" y="10" width="50" height="4" fill="#58a6ff" />
    <rect x="0" y="20" width="20" height="4" fill="#d29922" />
  </g>
</svg>
